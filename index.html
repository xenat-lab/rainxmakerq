<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAINXMAKERQ — Сигил</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --void:#020101;
  --bg2:#0c0405;
  --blood:#b0060f;
  --blood-dark:#5a0208;
  --ember:#ff2d1f;
  --ember-soft:#ff6a4d;
  --gold:#ffb347;
  --parchment:#f1e3c9;
  --parchment-dim:#c9b89a;
}

*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%; overflow-x:hidden; width:100%;}
body{
  min-height:100vh;
  background:
    radial-gradient(ellipse at 50% 20%, rgba(176,6,15,.14), transparent 60%),
    var(--void);
  color:var(--parchment);
  font-family:'IBM Plex Sans', sans-serif;
  overflow-x:hidden;
  position:relative;
  transition:background 1.2s ease;
}

/* ---------- ambient embers ---------- */
#embers{ position:fixed; inset:0; pointer-events:none; z-index:1; overflow:hidden; }
.ember-particle{
  position:absolute; bottom:-10px; border-radius:50%;
  background:var(--ember);
  box-shadow:0 0 8px 2px var(--ember);
  opacity:0; animation:rise linear infinite;
}
@keyframes rise{
  0%{ transform:translateY(0) translateX(0); opacity:0; }
  8%{ opacity:.85; }
  92%{ opacity:.4; }
  100%{ transform:translateY(-110vh) translateX(var(--drift,20px)); opacity:0; }
}

/* ---------- intro ritual overlay ---------- */
#ritual-intro{
  position:fixed; inset:0; z-index:100; background:var(--void);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px;
  transition:opacity 1s ease, visibility 1s ease;
}
#ritual-intro.hidden{ opacity:0; visibility:hidden; pointer-events:none; }
#ritual-intro svg{ width:min(220px, 52vw); height:min(220px, 52vw); overflow:visible; }
.sigil-path{
  fill:none; stroke:var(--ember); stroke-width:1.4;
  filter:drop-shadow(0 0 6px var(--ember));
  opacity:0;
}
.sigil-path.is-ready{
  opacity:1;
  animation:draw 1.8s cubic-bezier(.4,0,.2,1) forwards;
}
@keyframes draw{ to{ stroke-dashoffset:0; } }
.intro-label{
  text-align:center;
  font-family:'Cinzel', serif; letter-spacing:.35em; font-size:.72rem;
  color:var(--parchment-dim); text-transform:uppercase;
  opacity:0; animation:fadeText 2.2s ease forwards .5s;
}
@keyframes fadeText{ 0%{opacity:0;} 60%{opacity:1;} 100%{opacity:.8;} }

/* ---------- layout ---------- */
main{
  position:relative; z-index:2;
  min-height:100vh;
  display:flex; flex-direction:column; align-items:center;
  padding:48px 16px 64px;
}
@media (max-width:480px){
  main{ padding:32px 10px 48px; }
}

/* ---------- the card ---------- */
.card-wrap{
  position:relative;
  width:min(400px, 92vw);
  perspective:1400px;
}

.halo{
  position:absolute; top:-70px; left:50%; transform:translateX(-50%);
  width:260px; height:260px; border-radius:50%;
  border:6px solid var(--ember);
  box-shadow:0 0 40px 6px var(--ember), 0 0 90px 20px rgba(255,45,31,.35), inset 0 0 30px var(--ember);
  opacity:.9;
  animation:spin 22s linear infinite, pulse-halo 3.4s ease-in-out infinite;
  z-index:0;
}
@keyframes spin{ to{ transform:translateX(-50%) rotate(360deg); } }
@keyframes pulse-halo{ 0%,100%{ filter:brightness(1); } 50%{ filter:brightness(1.35); } }

.card{
  position:relative; z-index:2;
  border-radius:18px;
  box-shadow:
    0 0 0 1px rgba(0,0,0,.6),
    0 30px 60px -20px rgba(0,0,0,.9),
    0 0 40px -6px var(--ember);
  transform-style:preserve-3d;
  transition:transform .25s ease, box-shadow .5s ease;
}
.card:hover{ box-shadow:0 0 0 1px rgba(0,0,0,.6), 0 34px 70px -18px rgba(0,0,0,.95), 0 0 60px -4px var(--ember); }

.card-inner{
  position:relative;
  border-radius:18px;
  background:linear-gradient(180deg, #0a0304 0%, #060202 55%, #050101 100%);
  border:1px solid rgba(255,179,71,.35);
  overflow:hidden;
}
.card-inner::before{
  /* rune border frame */
  content:"";
  position:absolute; inset:6px;
  border:1px solid rgba(255,179,71,.25);
  border-radius:12px;
  pointer-events:none;
  z-index:5;
}
.card-inner::after{
  /* holo sweep */
  content:"";
  position:absolute; inset:-40%;
  background:linear-gradient(115deg, transparent 40%, rgba(255,179,71,.16) 48%, rgba(255,45,31,.22) 50%, rgba(255,179,71,.16) 52%, transparent 60%);
  transform:translateX(-60%);
  transition:transform .9s ease;
  pointer-events:none; z-index:6;
}
.card:hover .card-inner::after{ transform:translateX(60%); }

/* card art */
.card-art{
  position:relative; width:100%; aspect-ratio:4/5; overflow:hidden;
  display:flex; align-items:center; justify-content:center;
  background:
    radial-gradient(circle at 50% 38%, rgba(255,45,31,.4), transparent 62%),
    radial-gradient(ellipse at 50% 100%, rgba(255,45,31,.18), transparent 70%),
    #060101;
}
.card-art img{
  width:82%; height:82%; object-fit:contain; object-position:center;
  filter:saturate(1.1) contrast(1.12) drop-shadow(0 0 30px rgba(255,45,31,.45));
  display:block;
}
.card-art::after{
  content:""; position:absolute; inset:0;
  background:linear-gradient(180deg, transparent 62%, #050101 97%);
  pointer-events:none;
}
.rarity-tag{
  position:absolute; top:14px; left:14px; z-index:3;
  font-family:'IBM Plex Mono', monospace; font-size:.62rem; letter-spacing:.16em;
  color:var(--gold); background:rgba(0,0,0,.55); border:1px solid rgba(255,179,71,.4);
  padding:4px 9px; border-radius:4px; text-transform:uppercase;
}
.hp-tag{
  position:absolute; top:14px; right:14px; z-index:3;
  font-family:'IBM Plex Mono', monospace; font-size:.68rem;
  color:var(--ember-soft); background:rgba(0,0,0,.55); border:1px solid rgba(255,45,31,.4);
  padding:4px 9px; border-radius:4px;
}

/* seal / avatar medallion — sits on .card (outer, unclipped) so it never gets cropped */
.seal{
  position:absolute; bottom:-30px; left:22px; z-index:8;
  width:64px; height:64px; border-radius:50%;
  border:2px solid var(--gold);
  box-shadow:0 0 0 4px var(--void), 0 0 18px var(--ember);
  overflow:hidden;
  animation:seal-glow 2.6s ease-in-out infinite;
}
.seal img{ width:100%; height:100%; object-fit:cover; filter:contrast(1.1) saturate(1.1); }
@keyframes seal-glow{ 0%,100%{ box-shadow:0 0 0 4px var(--void), 0 0 14px var(--ember); } 50%{ box-shadow:0 0 0 4px var(--void), 0 0 26px var(--ember); } }

/* name plate */
.card-body{ position:relative; padding:44px 22px 20px; z-index:2; }
.name-plate{ text-align:center; margin-bottom:4px; }
.name-plate h1{
  font-family:'Cinzel Decorative', serif; font-weight:700;
  font-size:clamp(1.5rem, 6vw, 1.9rem);
  letter-spacing:.05em;
  color:var(--parchment);
  text-shadow:0 0 18px var(--ember), 0 0 2px #000;
}
.name-plate .subtitle{
  margin-top:6px;
  font-family:'IBM Plex Mono', monospace; font-size:.68rem; letter-spacing:.1em;
  color:var(--ember-soft); text-transform:uppercase;
  line-height:1.6; padding:0 4px;
}
@media (max-width:380px){
  .name-plate .subtitle{ font-size:.62rem; letter-spacing:.06em; }
}
.divider{
  margin:16px auto 18px; width:70%; height:1px;
  background:linear-gradient(90deg, transparent, var(--gold), transparent);
  opacity:.6;
}
.flavor{
  text-align:center; font-size:.82rem; line-height:1.55; color:var(--parchment-dim);
  font-style:italic; padding:0 6px 6px;
}

/* abilities / social list */
.abilities{ margin-top:20px; display:flex; flex-direction:column; gap:9px; }
.ability{
  position:relative;
  display:flex; align-items:center; gap:12px;
  padding:11px 13px;
  background:rgba(255,255,255,.02);
  border:1px solid rgba(255,179,71,.18);
  border-radius:9px;
  text-decoration:none; color:var(--parchment);
  overflow:hidden;
  transition:border-color .3s ease, background .3s ease, transform .2s ease;
  cursor:pointer;
}
.ability:hover{
  border-color:var(--ember);
  background:rgba(176,6,15,.10);
  transform:translateX(3px);
}
.ability::before{
  content:""; position:absolute; left:0; top:0; bottom:0; width:3px;
  background:var(--ember); box-shadow:0 0 8px var(--ember);
  transform:scaleY(0); transform-origin:bottom; transition:transform .3s ease;
}
.ability:hover::before{ transform:scaleY(1); }
.ability .icon{
  flex:0 0 auto; width:22px; height:22px; color:var(--gold);
  filter:drop-shadow(0 0 3px rgba(255,179,71,.5));
}
.ability .info{ flex:1; min-width:0; }
.ability .info .label{
  font-family:'Cinzel', serif; font-size:.85rem; letter-spacing:.03em;
}
.ability .info .sub{
  font-family:'IBM Plex Mono', monospace; font-size:.64rem; color:var(--parchment-dim);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.ability .cost{
  font-family:'IBM Plex Mono', monospace; font-size:.7rem; color:var(--ember-soft);
  border:1px solid rgba(255,45,31,.4); border-radius:50%;
  width:24px; height:24px; display:flex; align-items:center; justify-content:center;
  flex:0 0 auto;
}

/* card footer */
.card-footer{
  padding:6px 22px 18px; display:flex; justify-content:space-between; align-items:center;
  font-family:'IBM Plex Mono', monospace; font-size:.6rem; color:var(--parchment-dim);
  letter-spacing:.1em; text-transform:uppercase; opacity:.7;
}

/* blood drip */
.drip-layer{ position:absolute; left:0; right:0; bottom:-1px; height:0; overflow:visible; z-index:7; pointer-events:none; }
.drip{
  position:absolute; top:0; width:6px; border-radius:0 0 4px 4px;
  background:linear-gradient(180deg, var(--blood), var(--blood-dark));
  box-shadow:0 0 6px rgba(0,0,0,.5);
  animation:drip-grow 5.5s ease-in infinite;
  transform-origin:top;
}
.drip::after{
  content:""; position:absolute; bottom:-3px; left:50%; transform:translateX(-50%);
  width:9px; height:9px; border-radius:50%;
  background:var(--blood);
}
@keyframes drip-grow{
  0%{ height:0; opacity:0; }
  8%{ opacity:1; }
  55%{ height:var(--drip-len, 40px); opacity:1; }
  85%{ height:var(--drip-len, 40px); opacity:1; }
  100%{ height:var(--drip-len, 40px); opacity:0; }
}

/* splatter marks (appear on click bursts) */
.splatter{
  position:fixed; pointer-events:none; z-index:50;
  width:60px; height:60px; opacity:0;
}

/* reduced motion */
@media (prefers-reduced-motion: reduce){
  *{ animation-duration:.001s !important; animation-iteration-count:1 !important; transition-duration:.001s !important; }
}

::selection{ background:var(--ember); color:#000; }

/* focus visibility */
a:focus-visible, button:focus-visible, .ability:focus-visible{
  outline:2px solid var(--gold); outline-offset:2px;
}
</style>
</head>

    e.style.left = Math.random()*100+"vw";
    e.style.setProperty("--drift", (Math.random()*60-30)+"px");
    const dur = 6 + Math.random()*8;
    e.style.animationDuration = dur+"s";
    e.style.animationDelay = (Math.random()*dur)+"s";
    embersEl.appendChild(e);
  }

  /* ---------------- blood drips along card bottom ---------------- */
  const dripLayer = document.getElementById("dripLayer");
  const DRIP_COUNT = 6;
  for(let i=0;i<DRIP_COUNT;i++){
    const d = document.createElement("div");
    d.className = "drip";
    d.style.left = (6 + Math.random()*88) + "%";
    d.style.setProperty("--drip-len", (18 + Math.random()*46)+"px");
    d.style.animationDelay = (Math.random()*6)+"s";
    d.style.animationDuration = (5 + Math.random()*4)+"s";
    dripLayer.appendChild(d);
  }

  /* ---------------- card tilt on pointer move ---------------- */
  const card = document.getElementById("theCard");
  const cardWrap = document.querySelector(".card-wrap");
  let tiltEnabled = window.matchMedia("(hover: hover) and (pointer: fine)").matches;
  if(tiltEnabled){
    cardWrap.addEventListener("mousemove", (e)=>{
      const rect = cardWrap.getBoundingClientRect();
      const x = (e.clientX - rect.left)/rect.width - 0.5;
      const y = (e.clientY - rect.top)/rect.height - 0.5;
      card.style.transform = `rotateY(${x*8}deg) rotateX(${-y*8}deg) translateZ(0)`;
    });
    cardWrap.addEventListener("mouseleave", ()=>{
      card.style.transform = `rotateY(0deg) rotateX(0deg)`;
    });
  }

  /* ---------------- blood splatter burst on card click ---------------- */
  function spawnSplatter(x, y){
    const s = document.createElement("div");
    s.className = "splatter";
    s.style.left = (x-30)+"px";
    s.style.top = (y-30)+"px";
    const rot = Math.random()*360;
    s.innerHTML = `<svg viewBox="0 0 60 60" style="transform:rotate(${rot}deg)">
      <g fill="var(--blood)">
        <circle cx="30" cy="30" r="9"/>
        <circle cx="14" cy="16" r="3.5"/>
        <circle cx="46" cy="20" r="2.6"/>
        <circle cx="20" cy="46" r="3"/>
        <circle cx="42" cy="42" r="4"/>
        <circle cx="8" cy="34" r="2"/>
      </g>
    </svg>`;
    document.body.appendChild(s);
    s.animate(
      [
        { opacity:0, transform:"scale(.2)" },
        { opacity:.9, transform:"scale(1)", offset:.25 },
        { opacity:.7, transform:"scale(1)", offset:.7 },
        { opacity:0, transform:"scale(1.05)" }
      ],
      { duration:2600, easing:"ease-out" }
    ).onfinish = () => s.remove();
  }
  card.addEventListener("click", (e)=>{
    spawnSplatter(e.clientX, e.clientY);
  });

  /* ---------------- intro ritual ---------------- */
  const introEl = document.getElementById("ritual-intro");
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  if(reduceMotion){
    introEl.classList.add("hidden");
  } else {
    const sigilPaths = introEl.querySelectorAll(".sigil-path");
    sigilPaths.forEach(p => {
      const len = p.getTotalLength();
      p.style.strokeDasharray = len;
      p.style.strokeDashoffset = len;
    });
    // wait a frame so the browser paints the fully-hidden state first,
    // then trigger the reveal — avoids an instant jump-cut.
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        sigilPaths.forEach(p => p.classList.add("is-ready"));
      });
    });

    window.addEventListener("load", () => {
      setTimeout(() => introEl.classList.add("hidden"), 1700);
    });
  }

})();
</script>
</body>
</html>
